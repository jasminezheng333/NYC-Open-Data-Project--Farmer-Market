<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>NYC open data project</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <link href="style.css" rel="stylesheet" type="text/css" />
        <script src="helper.js"></script>
        <script src="script.js"></script>
        <link href="c3.css" rel="stylesheet" type="text/css" />
        <script src="c3.js"></script>
        <script src="d3.js"></script> 

  <style>
  body {
    background-color:rgb(143, 173, 145);
    background-image: url(ok.jpg);
  }
  </style>
</head>

<body onload="init()">

<nav class="container">
      <a href="index.html">Home Page</a>
      <a href="info.html">Information</a>
      <a href="analysis.html">Analysis</a>
</nav>

  <div id="banner" class="container center">
    <div style="text-align:center">
      <h1>FARMERS MARKETS ACROSS NEW YORK CITY</h1>
    </div>
  </div>

  <div class="container">
    <div id="leftPanel">
    <div class="card">
        <h3>SEARCH BY MARKET NAME</h3>
        <input type="text" id="name" placeholder="Enter Market Name">
        <hr>
        <a class="button" onclick="filterByMarketName()">Search</a>
      </div>

      <div class="card">
        <h3>SEARCH BY BOROUGH</h3>
        <input type="text" id="borough" placeholder="Enter Borough">
        <hr>
        <a class="button" onclick="filterByBorough()">Search</a>
      </div>

      <div class="card">
        <h3>SEARCH BY STREET ADDRESS</h3>
        <input type="text" id="address" placeholder="Enter Street Address">
        <hr>
        <a class="button" onclick="filterByAddress()">Search</a>
      </div>

      <div class="card">
        <h3>SEARCH BY COMMUNITY DISTRICT</h3>
        <input type="text" id="district" placeholder="Enter Community District">
        <hr>
        <a class="button" onclick="filterByDistrict()">Search</a>
      </div>

      <div class="card">
        <h3>RESET</h3>
        <button class="button" onclick="resetTo2025()">Show All 2025 Markets</button>
      </div>
    </div>

    <div id="rightPanel" class="card">
      <h1>FARMERS MARKETS</h1>
      <div id="output" class="container"></div>
    </div>

    <div id="map"></div>

  </div>

  <div id="footer" class="container center">
    <h3>FARMERS MARKETS LOCATION BY JASMINE ZHENG AND CHRISTOPHER BEHARRY</h3>
  </div>

</body>
</html>
